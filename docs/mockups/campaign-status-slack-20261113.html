<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
  body { margin: 0; background: var(--background, #fff); color: var(--foreground, #171717); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .note { font-size: 13px; color: var(--muted-foreground, #666); padding: 8px 4px 12px; line-height: 1.5; }
  .slack { --t:#1d1c1d; --s:#616061; background:#fff; color:var(--t); border:1px solid #ddd; border-radius:10px; padding:16px 18px; max-width:760px; }
  .msg { display:flex; gap:10px; }
  .av { width:36px; height:36px; border-radius:6px; background:#1d9bf0; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .who { font-weight:800; font-size:15px; } .who span { font-weight:400; color:var(--s); font-size:12px; margin-left:6px; }
  .txt { font-size:15px; margin:2px 0 8px; line-height:1.45; }
  .txt a { color:#1264a3; text-decoration:none; }
  .img { width:100%; border:1px solid #e8e8e8; border-radius:8px; overflow:hidden; }
  /* 아래는 서버가 그릴 이미지 자체(가로 1200 기준을 축소해서 보여줌) — 앱 색 그대로 */
  .card { --t:#0f1419; --s:#536471; --m:#6c7781; --b:#eff3f4; --bs:#cfd9de; --blue:#1d9bf0; --warn:#b45309; --warnbg:#fff4e5; --warnbd:#f6dfbd; --green:#0a7d54; --greenbg:#e8f6f0; --surf:#f7f9f9;
    background:#fff; color:var(--t); padding:28px 32px 26px; }
  .card * { box-sizing:border-box; }
  .h { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .h1 { font-size:24px; font-weight:800; }
  .h2 { font-size:15px; color:var(--s); }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:18px 0 20px; }
  .tile { border:1px solid var(--b); border-radius:12px; padding:14px 16px; }
  .tile.warn { background:var(--warnbg); border-color:var(--warnbd); }
  .tile .l { font-size:14px; color:var(--s); }
  .tile .v { font-size:30px; font-weight:800; margin-top:2px; }
  .tile.warn .v { color:var(--warn); }
  .tile .v small { font-size:16px; font-weight:400; color:var(--s); }
  .tile .d { font-size:13px; color:var(--m); margin-top:2px; }
  .rows { border-top:1px solid var(--bs); }
  .row { display:grid; grid-template-columns: 210px 170px 1fr 92px; align-items:center; gap:16px; height:52px; border-bottom:1px solid var(--b); }
  .name { font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { justify-self:start; font-size:14px; font-weight:600; padding:3px 11px; border-radius:999px; white-space:nowrap; }
  .chip.late { background:var(--warnbg); color:var(--warn); }
  .chip.done { background:var(--greenbg); color:var(--green); }
  .chip.ok { background:var(--surf); color:var(--s); }
  .chip.wait { color:var(--s); border:1px dashed var(--bs); }
  .bar { height:10px; background:#e6ecef; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); border-radius:99px; }
  .cnt { font-size:17px; text-align:right; font-variant-numeric:tabular-nums; }
  .cnt b { font-weight:800; }
  .cnt span { color:var(--s); }
  .foot { font-size:13px; color:var(--m); margin-top:14px; }

body{margin:0;background:#fff} .card{width:800px;box-sizing:border-box;padding:28px 28px 24px}
.h1{font-size:30px} .h2{font-size:18px} .tile .l{font-size:17px} .tile .v{font-size:38px} .tile .v small{font-size:20px} .tile .d{font-size:16px}
.row{grid-template-columns:200px 168px 1fr 92px;gap:14px;height:56px} .tiles{grid-template-columns:repeat(2,1fr)!important} .name{font-size:21px} .chip{font-size:17px} .cnt{font-size:21px} .foot{font-size:16px} .bar{height:12px}
</style></head><body><div class="card" id="card"></div><script>
const D = [
  ['가은치유한의원', 5, 5, 0], ['더스퀘어 클리닉', 8, 7, 0], ['서울SY피부과', 6, 5, 0], ['블리비의원', 8, 6, 0],
  ['리엔장 성형외과', 11, 7, 0], ['뷰티온 클리닉', 7, 4, 0], ['벤자민클리닉', 7, 3, 2], ['백수약국', 6, 2, 3], ['셀린 의원', 5, 2, 0], ['마인드', 0, 0, 0],
];
const live = D.filter(d => d[1] > 0);
const r = d => d[1] ? d[2] / d[1] : 0;
live.sort((a, b) => r(b) - r(a) || a[0].localeCompare(b[0], 'ko'));
const rows = live.concat(D.filter(d => d[1] === 0));
const plan = live.reduce((s, d) => s + d[1], 0), posted = live.reduce((s, d) => s + d[2], 0), late = live.reduce((s, d) => s + d[3], 0);
const chip = d => d[1] === 0 ? '<span class="chip wait">세팅 전</span>' : d[1] === d[2] ? '<span class="chip done">✓ 계획 완료</span>' : d[3] ? `<span class="chip late">예정일 지난 ${d[3]}건</span>` : '<span class="chip ok">예정대로</span>';
document.getElementById('card').innerHTML = `
  <div class="h"><div class="h1">11월 2주차 캠페인 현황</div><div class="h2">11/12 (수) 10:30 기준</div></div>
  <div class="tiles">
    <div class="tile"><div class="l">계획</div><div class="v">${plan}<small>건</small></div><div class="d">캠페인 10개, 1개는 세팅 전</div></div>
    <div class="tile"><div class="l">게시 완료</div><div class="v">${posted}<small>건</small></div><div class="bar" style="margin-top:10px"><i style="width:${posted / plan * 100}%"></i></div></div>
    <div class="tile warn"><div class="l">예정일 지난 미게시</div><div class="v">${late}<small>건</small></div><div class="d">백수약국 3건, 벤자민클리닉 2건</div></div>
    <div class="tile"><div class="l">남은 게시 예정</div><div class="v">${plan - posted - late}<small>건</small></div><div class="d">예정일 미정 2건 포함</div></div>
  </div>
  <div class="rows">${rows.map(d => `
    <div class="row"><div class="name">${d[0]}</div>${chip(d)}
      <div class="bar">${d[1] ? `<i style="width:${r(d) * 100}%"></i>` : ''}</div>
      <div class="cnt">${d[1] ? `<b>${d[2]}</b> <span>/ ${d[1]}건</span>` : '<span>-</span>'}</div></div>`).join('')}
  </div>
  <div class="foot">진행률(게시 ÷ 계획)이 높은 순이에요. 방문협찬(장기) 캠페인은 빠져 있어요.</div>`;
</script></body></html>
